{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>
<body>
    <div class="container">
        
        <form  method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <h1>Update Page</h1>

        <label for="">Profile Image</label>
        <img style="width: 100px; height: 80px;" src="{{ data.profile.url }}" alt="">
        <input type="file" name="profile" value="{{ data.profile.url }}"> <br>


        <label for="">Full Name</label>
        <input type="text" placeholder="Enter your full name" value="{{ data.full_name }}" name="full_name">

        <br>

        <label for="">User Name</label>
        <input type="text" placeholder="username"  value="{{ data.user_name }}" name="user_name">

        <br>

        <label for="">Password</label>
        <input type="password"  name="password">

        <br>

        <label for="">Confirm password</label>
        <input type="password" value="{{ data.confirm_password }}" name="confirm_password">

        <label for="">Phone Number</label>
        <input type="number" value="{{ data.number }}" name="number">

        <br>

        <label for="">Gender</label>
        <input type="radio" name="gender"  value="Male" {% if data.gender == 'Male' %}  checked {% endif %}>Male
        <input type="radio" name="gender" value="Female" {% if data.gender == 'Female' %}  checked {% endif %}>Female

        <br>

        <label for="">DOB</label>
        <input type="date"  value="{{ data.dob|date:'Y-m-d' }}" name="dob">

        <br>

        <label for="">Email</label>
        <input type="email"  value="{{ data.email }}" name="email">

        <br>

        <label for="">Address</label>
        <input type="text" value="{{ data.address }}" name="address">

        <br>
        
        <button type="submit">Register</button>

       </form>

    </div>
    
</body>
</html>
